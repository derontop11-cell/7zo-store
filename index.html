<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر 7zo</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .header {
      background: #111;
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
    }
    .cart-badge {
      background: #25D366;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 2px solid #f4f6f8;
      padding-bottom: 10px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }
    .btn-whatsapp {
      background: #25D366;
      color: white;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .product-item, .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .product-item:last-child, .cart-item:last-child {
      border-bottom: none;
    }
    .btn-sm {
      background: #111;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .total-box {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>متجر 7zo</h1>
    <div class="cart-badge" id="cartCount">السلة: 0</div>
  </div>

  <!-- المنتجات المتاحة -->
  <div class="card">
    <h2>المنتجات المتاحة</h2>
    <div id="productList"></div>
  </div>

  <!-- سلة الشراء -->
  <div class="card">
    <h2>سلة الشراء</h2>
    <div id="cartList">
      <p style="color: #888; text-align: center;">السلة فارغة.</p>
    </div>
    <div class="total-box">
      <span>الإجمالي:</span>
      <span id="totalPrice">0 ر.س</span>
    </div>
    <button class="btn btn-whatsapp" onclick="sendToWhatsApp()">
      إتمام الطلب والدفع عبر الواتساب 💬
    </button>
  </div>

  <script>
    const MY_PHONE_NUMBER = "966540627729"; 

    // المنتجات الدائمة المضافة لمتجرك
    let products = [
      { id: 1, name: "يوزر تيك توك رباعي عشوائي", price: 9 },
      { id: 2, name: "يوزر تيك توك شبه ثلاثي", price: 19 },
      { id: 3, name: "يوزر تيك توك ثلاثي عشوائي", price: 29 },
      { id: 4, name: "يوزر تيك توك ثلاثي مكرر", price: 39 }
    ];

    let cart = [];

    window.onload = function() {
      renderProducts();
    };

    function renderProducts() {
      const pList = document.getElementById('productList');
      pList.innerHTML = products.map(p => `
        <div class="product-item">
          <div>
            <strong>${p.name}</strong><br>
            <small style="color: #2563eb; font-weight: bold;">${p.price} ر.س</small>
          </div>
          <button class="btn-sm" onclick="addToCart(${p.id})">إضافة للسلة</button>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const item = products.find(p => p.id === productId);
      if (item) {
        cart.push(item);
        renderCart();
      }
    }

    function renderCart() {
      const cList = document.getElementById('cartList');
      const cartCount = document.getElementById('cartCount');
      const totalPrice = document.getElementById('totalPrice');

      cartCount.innerText = `السلة: ${cart.length}`;

      if (cart.length === 0) {
        cList.innerHTML = '<p style="color: #888; text-align: center;">السلة فارغة.</p>';
        totalPrice.innerText = '0 ر.س';
        return;
      }

      cList.innerHTML = cart.map((c, index) => `
        <div class="cart-item">
          <span>${c.name} - ${c.price} ر.س</span>
          <button style="background:#dc2626; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;" onclick="removeFromCart(${index})">إزالة</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      totalPrice.innerText = `${total} ر.س`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function sendToWhatsApp() {
      if (cart.length === 0) {
        alert("السلة فارغة! يرجى اختيار منتج أولاً.");
        return;
      }

      let message = "مرحباً متجر 7zo 👋%0Aأريد شراء اليوزرات التالية:%0A%0A";
      
      cart.forEach((item, index) => {
        message += `${index + 1}. ${item.name} - ${item.price} ر.س%0A`;
      });

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      message += `%0A*المبلغ الإجمالي:* ${total} ر.س%0A`;
      message += `%0Aيرجى تزويدي بطريقة الدفع (Apple Pay / تحويل بنكي) لاستلام اليوزر.`;

      const whatsappUrl = `https://wa.me/${MY_PHONE_NUMBER}?text=${message}`;
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
